name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-version-sync:
        description: Bypass the "src + Versions.props must change together" check for this run (one-off fixes, e.g. correcting a version number after the fact)
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  publish:
    name: Build, test & publish
    strategy:
      fail-fast: false
      matrix:
        package-name: [Core, AspNetCore, EntityFrameworkCore, OpenTelemetry]
    uses: ./.github/workflows/package-pipeline.yml
    with:
      package-name: ${{ matrix.package-name }}
      base-sha: ${{ github.event.before }}
      head-sha: ${{ github.sha }}
      skip-version-sync: ${{ inputs.skip-version-sync || false }}
    secrets:
      ARTIFACTS_SECRET: ${{ secrets.ARTIFACTS_SECRET }}

  release:
    name: Create combined release
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create combined release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BEFORE_SHA="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          EMPTY_TREE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$ZERO_SHA" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            BEFORE_SHA="$(git rev-parse "${{ github.sha }}^" 2>/dev/null || echo "$EMPTY_TREE")"
          fi

          OLD_VERSIONS_PROPS="$(git show "$BEFORE_SHA:Versions.props" 2>/dev/null || echo "")"

          # Only packages whose version property actually changed go in the release.
          PACKAGE_LIST=""
          for PACKAGE in Core AspNetCore EntityFrameworkCore OpenTelemetry; do
            OLD_VERSION="$(echo "$OLD_VERSIONS_PROPS" | grep -oP "(?<=<${PACKAGE}Version>)[^<]+" || echo "")"
            NEW_VERSION="$(grep -oP "(?<=<${PACKAGE}Version>)[^<]+" Versions.props)"

            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              PACKAGE_LIST="${PACKAGE_LIST}${PACKAGE} v${NEW_VERSION}, "
            fi
          done
          PACKAGE_LIST="${PACKAGE_LIST%, }"

          if [ -z "$PACKAGE_LIST" ]; then
            echo "No package versions changed in this push, skipping release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TAG="release-$(git rev-parse --short HEAD)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping (likely a re-run of a completed publish)."
            exit 0
          fi

          NOTES="$(awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{if (flag) exit} flag' CHANGELOG.md | sed '/^---$/d')"
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="No changelog entry was found under **Unreleased** at release time. See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the latest notes."
          fi

          {
            echo "$NOTES"
            echo ""
            echo "---"
            echo "Published: $PACKAGE_LIST"
            echo "Commit: ${{ github.sha }}"
          } > release-notes.md

          gh release create "$TAG" \
            --title "Release: $PACKAGE_LIST" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"
